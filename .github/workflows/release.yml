name: Release

# Every push to main whose package.json version has no matching tag yet
# gets tagged v<version> and published as a GitHub release with the built
# card attached (HACS installs the asset). Bump package.json to cut a release.

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src/**
      - dist/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$v already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.exists == 'false'
        run: npm ci && npm run build

      - name: Tag and publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" dist/lovelace-personal-wakeup-card.js \
            --title "v$VERSION" \
            --generate-notes
